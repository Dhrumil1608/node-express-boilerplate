version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - mkdir -p .cicd-build bundle/scripts
      - cp cicd-package.json .cicd-build/package.json
      - cd .cicd-build && npm install --ignore-scripts && cd ..

  pre_build:
    commands:
      - node --check demo-server.js

  build:
    commands:
      - cp demo-server.js ecosystem.config.json appspec.yml bundle/
      - cp cicd-package.json bundle/package.json
      - cp -r .cicd-build/node_modules bundle/
      - cp -r scripts/* bundle/scripts/

artifacts:
  base-directory: bundle
  files:
    - '**/*'